name: 채용공고 크롤링 & 배포

on:
  schedule:
    # 매일 오전 6시 KST (UTC 21:00)
    - cron: '0 21 * * *'
    # 매일 오후 6시 KST: 긴급 항목과 소스 장애만 추가 확인
    - cron: '0 9 * * *'
  workflow_dispatch: # 수동 실행 가능

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: npm 의존성 설치
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Playwright 브라우저 캐시
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Playwright chromium 설치
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Playwright OS 의존성 설치
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: 이전 결과와 누적 이력 복원
        uses: actions/cache/restore@v4
        with:
          path: |
            crawlers/results.prev.json
            crawlers/experience-results.prev.json
            data/history
            data/opportunity-state.json
            data/program-series.json
          key: work-finder-state-${{ github.run_number }}
          restore-keys: |
            work-finder-state-

      - name: 타입 검사
        run: npm run typecheck

      - name: 회귀 테스트
        run: npm test

      - name: 크롤링 실행
        run: npm run crawl

      - name: 직무경험 공고 크롤링
        run: npm run crawl:experience

      - name: 신규·변경·이력·소스 상태 분석
        run: npm run analyze

      - name: Discord 알림
        continue-on-error: true
        run: npm run notify:discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_NOTIFY_MODE: ${{ (github.event_name == 'workflow_dispatch' || github.event.schedule == '0 21 * * *') && 'daily' || 'urgent' }}

      - name: 다음 실행을 위해 현재 결과를 이전 결과로 복사
        run: |
          cp crawlers/results.json crawlers/results.prev.json
          cp crawlers/experience-results.json crawlers/experience-results.prev.json

      - name: 이전 결과와 누적 이력 캐시 저장
        uses: actions/cache/save@v4
        with:
          path: |
            crawlers/results.prev.json
            crawlers/experience-results.prev.json
            data/history
            data/opportunity-state.json
            data/program-series.json
          key: work-finder-state-${{ github.run_number }}

      - name: 결과 업로드
        uses: actions/upload-artifact@v4
        with:
          name: crawl-results-${{ github.run_number }}
          path: |
            crawlers/results.json
            crawlers/experience-results.json
            crawlers/opportunity-events.json
            crawlers/source-health.json
            crawlers/notification-summary.json
            data/history
            data/program-series.json
          retention-days: 90

      - name: 배포 파일 준비
        run: |
          cp crawlers/results.json web/results.json
          cp crawlers/new-postings.json web/new-postings.json
          cp crawlers/experience-results.json web/experience-results.json
          cp crawlers/source-health.json web/source-health.json
          cp data/learned-exclusions.json web/learned-exclusions.json

      - name: Pages 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: crawl
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
